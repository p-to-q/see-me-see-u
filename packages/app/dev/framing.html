<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20role%3D%22img%22%20aria-label%3D%22ME%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20fill%3D%22%230e0f12%22%2F%3E%3Cg%20fill%3D%22%23dfe4ea%22%20transform%3D%22translate(1.163%2045.79)%20scale(.0394%20-.0394)%22%3E%3Cpath%20d%3D%22M72%20700V0H185V463H214L342%200H428L743%20472L772%20463L771%200H884V700H763L434%20188H401L254%20700Z%22%2F%3E%3Cpath%20transform%3D%22translate(956)%22%20d%3D%22M71%20700V0H537V98H214L184%20128V282L214%20312H517V410H214L184%20440V572L214%20602H537V700Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>取景模式 · SEE-ME SEE-U</title>
<link rel="stylesheet" href="../src/ui/type.css">
<style>
  body { padding: var(--sb-safe); }
  .row { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: var(--sb-gutter); margin-top: 1.5em; }
  canvas { width: 100%; background: #0a0b0d; border: 1px solid var(--sb-rule); display: block; }
  #num div { padding: 0.35em 0; border-bottom: 1px solid var(--sb-rule); font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
  #num div:first-child { font-size: 16px; }
  .bar { display: flex; gap: 1em; align-items: baseline; flex-wrap: wrap; margin-top: 1em; }
  button, select { font: inherit; }
  figcaption { margin-top: 0.6em; color: var(--sb-ink-dim); }
</style>
</head>
<body>
<main>
  <p class="sb-label">DEV · 取景模式</p>
  <h1>只露上半身，还是退后让它看见全身</h1>
  <p style="max-width:var(--sb-measure)">
    分类器与控制器（<code>core/src/autoframe.ts</code>）每一帧在想什么、让画面怎么动（docs/49 §5 / §6）。
    上：摄像头原图里的 33 个点（实心 = 可信），小屏裁切的目标窗口、死区与实际窗口。中：舞台上身体的横向位置、目标、死区与余量。
    下：最近 20 秒的模式色带与放大倍数 / 景别进度及速度 / 横向偏移 / 纵向移轴 / 腿的曲线。
    没有摄像头时播合成时间线，和 node 测试、<code>scripts/framing/trace.ts</code> 喂的是同一份。
  </p>
  <div class="bar">
    <button id="cam" type="button">用摄像头</button>
    <label>时间线 <select id="script"></select></label>
    <label>策略 <select id="policy"><option value="script">跟时间线</option><option>auto</option><option>full</option><option>upper</option></select></label>
    <label><input id="kiosk" type="checkbox"> 现场（全身优先）</label>
    <label><input id="reduced" type="checkbox"> 减少动态</label>
    <label><input id="hold" type="checkbox"> 降级 hold</label>
    <label><input id="camframing" type="checkbox"> 摄像头在取景</label>
    <label><input id="drift" type="checkbox"> 身体已非人形</label>
    <label><input id="companions" type="checkbox"> 台上有同伴</label>
    <span id="src" class="sb-label"></span>
  </div>
  <div class="row">
    <figure style="margin:0">
      <canvas id="view" width="640" height="360"></canvas>
      <canvas id="stage" width="640" height="110" style="margin-top:8px"></canvas>
      <canvas id="line" width="640" height="140" style="margin-top:8px"></canvas>
      <figcaption>数值面板里每 16ms 的最大变化量超过 <code>AUTOFRAME.maxStep</code> 时变红</figcaption>
    </figure>
    <div id="num"></div>
  </div>
</main>
<script type="module" src="./framing.ts"></script>
<script type="module" src="./devnav.ts"></script>
</body>
</html>
