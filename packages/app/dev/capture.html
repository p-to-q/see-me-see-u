<title>采集 · SEE-ME SEE-U</title>
<link rel="stylesheet" href="../src/ui/type.css">
<style>
  /* 这一页的内容是摄像头画面本身，所以它自己要一个铺满的视频层。
     其余的排版、HUD、页脚全部来自 type.css / chrome.css，这里不再定义字号和颜色。 */
  #wrap { position: fixed; inset: 0; }
  #wrap video, #wrap canvas {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain;
  }
  #wrap video { background: #000; }
  /* 量程统计贴右上角，和左上角的 HUD 对称 */
  #axes {
    position: fixed; right: calc(var(--sb-safe) * 0.5); left: auto;
    top: calc(var(--sb-safe) * 0.5 + 3.4em);
    text-align: left;
  }
</style>
</head>
<body>
<div id="wrap"><video id="cam" playsinline muted></video><canvas id="ov"></canvas></div>
<div id="hud" class="sb-hud-dev">启动中…</div>
<div id="axes" class="sb-hud-dev"></div>
<div id="help" class="sb-foot-dev">R = 清空量程统计 ｜ ?demo=1 = 回放 ｜ ?clip=/demo/xxx.json = 指定回放文件</div>
<script type="module" src="./capture.ts"></script>
<script type="module" src="./devnav.ts"></script>
</body>
</html>
