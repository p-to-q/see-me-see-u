<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20role%3D%22img%22%20aria-label%3D%22ME%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20fill%3D%22%230e0f12%22%2F%3E%3Cg%20fill%3D%22%23dfe4ea%22%20transform%3D%22translate(1.163%2045.79)%20scale(.0394%20-.0394)%22%3E%3Cpath%20d%3D%22M72%20700V0H185V463H214L342%200H428L743%20472L772%20463L771%200H884V700H763L434%20188H401L254%20700Z%22%2F%3E%3Cpath%20transform%3D%22translate(956)%22%20d%3D%22M71%20700V0H537V98H214L184%20128V282L214%20312H517V410H214L184%20440V572L214%20602H537V700Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEE-ME SEE-U</title>
<style>
 html,body{margin:0;height:100%;background:#0e0f12;overflow:hidden}
 /* 进展签 / 选择页的那几次：第一帧就是纸，不先闪一块深底（docs/47）。
    令牌到了之后由 first-screen.css 接手，这一行只管样式表到达之前 */
 html.sb-first-screen,html.sb-first-screen body{background:#fafafa}
 canvas{display:block}
 /* 跨页过渡（docs/47）。type.css 里也有一份，但这一页的样式表是脚本带进来的，晚于第一帧。
    叠层的底 = 这一页第一帧的底：缺省透明会透出白 */
 @view-transition{navigation:auto}
 ::view-transition{background:#0e0f12}
 html.sb-first-screen::view-transition{background:#fafafa}
 @media (prefers-reduced-motion: reduce){@view-transition{navigation:none}}
</style>
<script>
 // 第一帧的底色：ui/transitions.ts 的 groundFor() 在这里的一份抄本（测试逐条对）。
 // 这一刻还没有任何模块，所以只能抄。main.ts 的 adoptPrepaint() 接过这一份 hold。
 (function(){var q=new URLSearchParams(location.search);if(q.get('selftest')!=='1'&&!q.get('theme'))document.documentElement.classList.add('sb-first-screen')})();
 // 跨页过渡落定（ui/page-transition.ts 的 revealSettled）。main.ts 等它之后才起 WebGPU：
 // 着色器编译会把合成器卡住，淡入的那 240ms 于是一帧都没有，读作一刀切（docs/47 §4.3）。
 // 看门狗 = SETTLE_MS。没有 pagereveal 的浏览器、没有过渡的进入（地址栏、重载、现场）当场落定；
 // 1500ms 兜底：这一句永远不许让开机停住。
 (function(){var done,p=new Promise(function(r){done=r});window.sbRevealSettled=p;setTimeout(done,1500);
  if(!('onpagereveal' in window)){done();return}
  addEventListener('pagereveal',function(e){var v=e.viewTransition;if(!v){done();return}
   // 门槛（ui/transitions.ts 的 transitionAllowed 的抄本，只抄首页能判的几条）：?vt=off、现场、前进后退
   var q=new URLSearchParams(location.search),n=window.navigation,tr=!!(n&&n.activation&&n.activation.navigationType==='traverse');
   if(q.get('vt')==='off'||q.get('kiosk')==='1'||tr){try{v.skipTransition()}catch(x){}done();return}
   var t=setTimeout(function(){v.skipTransition()},630);v.finished.finally(function(){clearTimeout(t);done()}).catch(function(){})},{once:true})})();
</script></head>
<body><script type="module">
 // 两条路，都是字面量 import —— 打包器照样能静态分析，两个 chunk 互不牵连。
 //
 // `/about` 曾经也在这里分支（它没有自己的 .html，靠 vercel.json 的 rewrite）。
 // 现在它是 `about.html`，和 lineage / making / passport 一样是真页面 ——
 // 因为 cleanUrls 打开之后 rewrite 和它打架，线上 /about 直接 404。
 //
 // ?selftest=1   开场自检页，同样**不启动主程序**：它要在"主程序起不来"的时候
 //               也能打开，所以它不能是主程序的一部分。
 // 其余          正常进作品。
 if (new URLSearchParams(location.search).get('selftest') === '1') {
   document.documentElement.style.overflow = 'auto';
   import('./src/shell/selftest.ts');
 } else {
   import('./src/main.ts');
 }
</script></body>
</html>
